<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>From the hOn account to a command and its state (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="980" y="590" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40" y="20" width="160" height="40" rx="8" fill="#f4f5f7" stroke="#8a949e"/>
    <text x="120" y="46" fill="#24303c">User</text>
    <rect x="290" y="20" width="160" height="40" rx="8" fill="#eef4fb" stroke="#2979d6"/>
    <text x="370" y="46" fill="#1d4f8c">Gladys</text>
    <rect x="540" y="20" width="160" height="40" rx="8" fill="#f3f7ef" stroke="#4c8c2b"/>
    <text x="620" y="46" fill="#2f5d16">Integration</text>
    <rect x="790" y="20" width="170" height="40" rx="8" fill="#fbf3ec" stroke="#c46a1d"/>
    <text x="875" y="46" fill="#8a4410">hOn cloud</text>
  </g>
  <g stroke="#c3c9cf" stroke-width="2" stroke-dasharray="6 6">
    <line x1="120" y1="60" x2="120" y2="575"/>
    <line x1="370" y1="60" x2="370" y2="575"/>
    <line x1="620" y1="60" x2="620" y2="575"/>
    <line x1="875" y1="60" x2="875" y2="575"/>
  </g>
  <g font-size="13" fill="#24303c" stroke="#46505a" stroke-width="2">
    <line x1="120" y1="90" x2="362" y2="90" marker-end="url(#arrow)"/>
    <line x1="370" y1="125" x2="612" y2="125" marker-end="url(#arrow)"/>
    <line x1="620" y1="160" x2="867" y2="160" marker-end="url(#arrow)"/>
    <line x1="875" y1="195" x2="628" y2="195" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="620" y1="230" x2="378" y2="230" marker-end="url(#arrow)"/>
    <line x1="120" y1="265" x2="362" y2="265" marker-end="url(#arrow)"/>
    <line x1="370" y1="300" x2="612" y2="300" marker-end="url(#arrow)"/>
    <line x1="620" y1="335" x2="378" y2="335" marker-end="url(#arrow)"/>
    <line x1="120" y1="380" x2="362" y2="380" marker-end="url(#arrow)"/>
    <line x1="370" y1="415" x2="612" y2="415" marker-end="url(#arrow)"/>
    <line x1="620" y1="450" x2="867" y2="450" marker-end="url(#arrow)"/>
    <line x1="620" y1="495" x2="867" y2="495" marker-end="url(#arrow)"/>
    <line x1="875" y1="525" x2="628" y2="525" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="620" y1="560" x2="378" y2="560" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" fill="#24303c">
    <text x="128" y="82">e-mail + password (configuration)</text>
    <text x="378" y="117">config</text>
    <text x="628" y="152">login, appliance list, status</text>
    <text x="628" y="187">appliances + their parameters</text>
    <text x="378" y="222">discovered devices</text>
    <text x="128" y="257">Discover tab: Add</text>
    <text x="378" y="292">device created</text>
    <text x="378" y="327">every known state</text>
    <text x="128" y="372">chooses the “Cottons” program</text>
    <text x="378" y="407">setValue(program, cottons)</text>
    <text x="628" y="442">send startProgram</text>
    <text x="628" y="487">read again: 5 s, 20 s, each poll</text>
    <text x="628" y="517">running, washing, 120 min left</text>
    <text x="378" y="552">states (changes only) + scene “cycle started”</text>
  </g>
</svg>
