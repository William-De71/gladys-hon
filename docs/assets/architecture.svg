<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Architecture of the hOn integration for Gladys Assistant (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="980" y="408" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>

  <!-- Gladys -->
  <rect x="20" y="40" width="230" height="320" rx="14" fill="#eef4fb" stroke="#2979d6" stroke-width="2"/>
  <text x="135" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4f8c">Gladys Assistant</text>
  <g font-size="14" fill="#24303c">
    <rect x="38" y="92" width="194" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="135" y="116" text-anchor="middle">Devices, Discover tab</text>
    <rect x="38" y="140" width="194" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="135" y="164" text-anchor="middle">Configuration buttons</text>
    <rect x="38" y="188" width="194" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="135" y="212" text-anchor="middle">Scenes: triggers, actions</text>
    <rect x="38" y="236" width="194" height="58" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="135" y="260" text-anchor="middle">“hOn appliances” and</text>
    <text x="135" y="280" text-anchor="middle">“hOn appliance” widgets</text>
    <rect x="38" y="304" width="194" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="135" y="328" text-anchor="middle">Configuration (account)</text>
  </g>

  <!-- Link Gladys / container -->
  <line x1="256" y1="200" x2="354" y2="200" stroke="#46505a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="305" y="172" text-anchor="middle" font-size="12" fill="#46505a">REST</text>
  <text x="305" y="187" text-anchor="middle" font-size="11" fill="#46505a">/api/integration/v1</text>
  <text x="305" y="222" text-anchor="middle" font-size="12" fill="#46505a">+ WebSocket</text>

  <!-- Container -->
  <rect x="360" y="40" width="260" height="320" rx="14" fill="#f3f7ef" stroke="#4c8c2b" stroke-width="2"/>
  <text x="490" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5d16">Integration container</text>
  <g font-size="14" fill="#24303c">
    <rect x="378" y="92" width="224" height="58" rx="8" fill="#ffffff" stroke="#bdd6ad"/>
    <text x="490" y="116" text-anchor="middle">Node.js + Gladys SDK</text>
    <text x="490" y="136" text-anchor="middle">src/app.js: poll, states, scenes</text>
    <rect x="378" y="160" width="224" height="58" rx="8" fill="#ffffff" stroke="#bdd6ad"/>
    <text x="490" y="184" text-anchor="middle">hOn client (src/hon/)</text>
    <text x="490" y="204" text-anchor="middle">CIAM login, REST, commands</text>
    <rect x="378" y="228" width="224" height="58" rx="8" fill="#ffffff" stroke="#bdd6ad"/>
    <text x="490" y="252" text-anchor="middle">/data: hOn session</text>
    <text x="490" y="272" text-anchor="middle">(never the password)</text>
    <text x="490" y="320" text-anchor="middle" font-size="12" fill="#46505a">read-only rootfs, 256 MB, non-root</text>
  </g>

  <!-- Link container / cloud -->
  <line x1="626" y1="200" x2="724" y2="200" stroke="#46505a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="675" y="180" text-anchor="middle" font-size="12" fill="#46505a">HTTPS</text>
  <text x="675" y="222" text-anchor="middle" font-size="12" fill="#46505a">Internet</text>

  <!-- Cloud and appliances -->
  <rect x="730" y="40" width="250" height="320" rx="14" fill="#fbf3ec" stroke="#c46a1d" stroke-width="2"/>
  <text x="855" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#8a4410">hOn cloud</text>
  <g font-size="14" fill="#24303c">
    <rect x="748" y="92" width="214" height="58" rx="8" fill="#ffffff" stroke="#e5c3a5"/>
    <text x="855" y="116" text-anchor="middle">api-iot.he.services</text>
    <text x="855" y="136" text-anchor="middle">(unofficial, the app’s API)</text>
    <line x1="855" y1="156" x2="855" y2="196" stroke="#46505a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="845" y="182" text-anchor="end" font-size="12" fill="#46505a">Wi-Fi</text>
    <rect x="748" y="204" width="214" height="138" rx="8" fill="#ffffff" stroke="#e5c3a5"/>
    <text x="855" y="228" text-anchor="middle" font-weight="700">Haier · Candy · Hoover</text>
    <text x="855" y="252" text-anchor="middle">washers, dryers</text>
    <text x="855" y="274" text-anchor="middle">dishwashers, ovens</text>
    <text x="855" y="296" text-anchor="middle">air conditioners</text>
    <text x="855" y="318" text-anchor="middle">fridges, freezers</text>
  </g>
</svg>
