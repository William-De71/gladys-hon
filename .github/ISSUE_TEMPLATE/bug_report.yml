name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Test the connection** button of the configuration and the **hOn appliance** widget often tell where it stops: paste their messages below. Never paste your hOn password or tokens.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → hOn, Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: appliance
    attributes:
      label: Appliance
      description: Brand, type and model as shown in the hOn app (and its `HON_TYPE` / `HON_MODEL` device parameters in Gladys).
      placeholder: 'Candy CSO4 1275TBE, washing machine (WM)'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: What the hOn app shows at the same moment helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Logs tab of the integration page), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines. Remove e-mail addresses and tokens first.
      render: text
